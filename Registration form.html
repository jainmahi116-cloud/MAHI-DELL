<form align = "center">
    <fieldset>
    <legend>Login form</legend>
    <label for="FullName">Full Name</label>
    <input type="text" placeholder="Full Name" required><br>
    <label for="Contact No.">Contact No.</label>
    <input type="number" placeholder="Contact No. " maxlength="10" required><br>
    <label for="Email">Email id</label>
    <input type = "email" placeholder = "Email id" required><br>
    <label for="password">Password</label>
    <input type = "password" placeholder = "Password" maxlength="20"7minlength="10" required><br>
    <label for = "password">Retype Password</label>
    <input type="password" placeholder="Retype Password" maxlength="20" minlength="10" required><br>
    <label for="Address">Address</label>
    <input type="text area" placeholder="" required><br>
    <label for="gender">Gender</label>
    <input type = "radio" id="female" name="gender" value="female" required>
    <label for="female">female</label>
    <input type = "radio" id="male" name="gender" value="male" required>
    <label for="male">male</label><br>
    <input type="checkbox" required>
    <label>Agree And Continue</label><br>
    <button type="submit">Submit</button>
    </fieldset>
</form>



</body>
